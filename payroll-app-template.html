<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --navy1:#1e3179; --navy2:#293e87; --navyD:#1c2e75;
    --page:#f4f6f9; --panel:#ffffff; --rule:#e2e8ef; --hdbg:#f7f9fc; --zebra:#fbfcfe;
    --ink:#0f1b33; --ink2:#44546e; --ink3:#8394ab; --label:#6b7f9c;
    --blueT:#eaf1fb; --blueB:#c3d7ef;
    --red:#d6392b; --redT:#fbeae8;
    --green:#0f6350; --greenT:#e4f1ed;
    --gold:#8f6704; --goldT:#fbf2d9; --goldBar:#c9911a;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sh: 0 1px 2px rgba(15,27,51,.05), 0 1px 10px rgba(15,27,51,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  .app{font-family:var(--sans);color:var(--ink);background:var(--page);
    height:100vh; height:100dvh; min-height:560px;
    border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .app h1,.app h2,.app h3,.app h4{margin:0;font-weight:600}
  .app button{font-family:inherit;cursor:pointer}
  .app p{margin:0}

  /* header */
  .hdr{background:linear-gradient(90deg,var(--navy1),var(--navy2));color:#fff;padding:15px 22px;display:flex;align-items:flex-start;gap:14px;flex:none;position:relative;z-index:60}
  .logo{width:46px;height:46px;border-radius:8px;background:#fff;color:var(--navyD);display:grid;place-items:center;font:700 16px/1 var(--sans);letter-spacing:-.03em;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.22)}
  .hgroup{min-width:0}
  .hgroup h1{font-size:20px;font-weight:700;letter-spacing:-.012em;line-height:1.25}
  .hgroup p{margin-top:6px;font-size:11.5px;color:#c2cfe9;line-height:1.5}
  .acct{margin-left:auto;text-align:right;position:relative;flex:none}
  .pill{background:#fff;color:var(--navyD);border:0;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;display:inline-flex;gap:8px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .pill:hover{background:#eef2fa}
  .car{font-size:9px;opacity:.65}
  .stamp{font:400 10.5px/1.5 var(--mono);color:#b7c5e2;margin-top:8px;white-space:nowrap}
  .menu{position:absolute;right:0;top:44px;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(15,27,51,.24);min-width:206px;padding:6px;display:none;z-index:40;text-align:left}
  .menu.open{display:block}
  .menu button{display:flex;gap:10px;width:100%;background:none;border:0;padding:9px 11px;border-radius:6px;font-size:13px;color:var(--ink);align-items:center;text-align:left}
  .menu button:hover{background:var(--page)}
  .menu .ic{width:15px;text-align:center;opacity:.7;font-size:12px}
  .menu .sep{height:1px;background:var(--rule);margin:5px 8px}
  .menu button.out{color:var(--red)}
  .menu button.out:hover{background:var(--redT)}

  /* tabs */
  .tabs{background:#fff;border-bottom:1px solid var(--rule);display:flex;gap:2px;padding:0 22px;overflow-x:auto;overflow-y:hidden;flex:none;position:relative;z-index:50}
  .tabs button{background:none;border:0;padding:15px 14px 12px;font-size:13.5px;color:#5b6b83;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
  .tabs button:hover{color:var(--navyD)}
  .tabs button[aria-current="true"]{color:var(--navyD);font-weight:600;border-bottom-color:var(--navyD)}

  .body{padding:20px 22px 26px;overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain}

  /* sticky block on the timesheet */
  .stick{position:sticky;top:-20px;z-index:30;background:var(--page);
    margin:-20px -22px 12px;padding:10px 22px 10px;
    border-bottom:1px solid var(--rule);box-shadow:0 4px 10px -6px rgba(15,27,51,.28)}
  .stick .period{margin-bottom:8px;padding:9px 14px}
  .stick .card{margin-top:0}
  .strip{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:10px 16px}
  .strip .f{display:flex;align-items:baseline;gap:7px}
  .strip .f span{font:600 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
  .strip .f b{font:700 16px/1 var(--mono);letter-spacing:-.02em;color:var(--navyD);font-variant-numeric:tabular-nums}
  .strip .f.ot b{color:var(--gold)}
  .strip .rate{margin-left:auto;font:400 11px/1.4 var(--mono);color:var(--ink3);text-align:right}
  .strip .bar{flex:1 1 160px;min-width:120px;height:10px}

  /* period bar */
  .period{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:13px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:16px}
  .period .lb{font:600 10px/1 var(--mono);letter-spacing:.15em;color:var(--label);text-transform:uppercase}
  .period .spacer{flex:1}
  .tagpill{background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:6px 13px;font:400 11.5px/1 var(--mono);color:var(--ink2)}
  .hint{font-size:12px;color:var(--ink3)}
  .hint b{color:var(--navyD);font-weight:600}

  select,input[type=text],input[type=number],input[type=password],input[type=date],textarea{font-family:var(--sans);font-size:13px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:62px;line-height:1.5}
  select:hover,input:hover,textarea:hover{border-color:var(--blueB)}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--navyD);outline-offset:-1px;border-color:var(--navyD)}

  .btn{background:var(--navyD);color:#fff;border:0;padding:8px 15px;border-radius:6px;font-size:12.5px;font-weight:600}
  .btn:hover{background:#16255e}
  .btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--rule)}
  .btn.ghost:hover{background:var(--blueT);color:var(--navyD);border-color:var(--blueB)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #eec9c4}
  .btn.danger:hover{background:var(--redT)}
  .btn.sm{padding:6px 11px;font-size:11.5px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* generic dropdown */
  .dd{position:relative;display:inline-block}
  .dd-menu{position:absolute;right:0;top:38px;background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(15,27,51,.22);min-width:190px;padding:6px;display:none;z-index:30}
  .dd-menu.open{display:block}
  .dd-menu button{display:block;width:100%;background:none;border:0;padding:9px 11px;border-radius:6px;font-size:12.5px;color:var(--ink);text-align:left}
  .dd-menu button:hover{background:var(--page)}
  .dd-menu .sep{height:1px;background:var(--rule);margin:5px 8px}

  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--sh)}
  .card + .card{margin-top:16px}
  .card .hd{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .card .hd h3{font-size:13.5px;letter-spacing:-.01em;color:var(--ink);font-weight:600}
  .card .hd .spacer{flex:1}
  .card .bd{padding:18px}
  .note{font-size:12px;line-height:1.65;color:var(--ink2)}

  /* meter */
  .meter{padding:18px}
  .meter .row{display:flex;align-items:flex-start;gap:30px;flex-wrap:wrap;margin-bottom:15px}
  .meter .lb{font:600 10px/1.3 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
  .meter .big{font:700 26px/1 var(--mono);letter-spacing:-.03em;color:var(--navyD);margin-top:8px}
  .meter .big span{font-size:12.5px;color:var(--ink3);margin-left:4px;font-weight:400}
  .tag{font:600 10px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
  .tag.ot{background:var(--goldT);color:var(--gold)}
  .tag.ok{background:var(--greenT);color:var(--green)}
  .bar{height:20px;background:#e9edf4;border-radius:6px;display:flex;position:relative;overflow:hidden}
  .bar i{display:block;height:100%}
  .bar .n{background:var(--navyD)}
  .bar .o{background:var(--goldBar)}
  .bar .std{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:9px;font:400 11px/1 var(--mono);color:var(--ink2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}

  /* tables */
  .scroll{overflow-x:auto}
  .scroll.tall{max-height:calc(100dvh - 360px);min-height:220px;overflow:auto}
  .scroll.tall thead th{position:sticky;top:0;z-index:4}
  .scroll.tall th:first-child{z-index:5}
  th:first-child{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--rule)}
  td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--rule)}
  tbody tr:nth-child(even) td:first-child{background:var(--zebra)}
  tbody tr:hover td:first-child{background:var(--blueT)}
  tr.tot td:first-child,tr.tot:hover td:first-child{background:var(--hdbg)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{font:600 9.5px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--label);text-align:right;padding:11px 9px;background:var(--hdbg);border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:bottom}
  th:first-child,th.l{text-align:left}
  td{padding:6px 9px;border-bottom:1px solid #eef1f6;text-align:right;white-space:nowrap}
  td:first-child,td.l{text-align:left}
  td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even) td{background:var(--zebra)}
  tbody tr:hover td{background:var(--blueT)}
  tr.tot td,tr.tot:hover td{border-top:2px solid var(--navyD);border-bottom:0;font-weight:600;background:var(--hdbg);color:var(--navyD)}
  tr.sub td,tr.sub:hover td{background:var(--hdbg);font-weight:600}
  .muted{color:var(--ink3)}
  .ok{color:var(--green);font-weight:600}
  .bad{color:var(--red);font-weight:600}

  /* chips */
  .chip{display:inline-block;font:600 9px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;padding:5px 7px;border-radius:4px;min-width:46px;text-align:center}
  .chip.wd{background:#eaeff6;color:var(--ink2)}
  .chip.sat{background:var(--greenT);color:var(--green)}
  .chip.hol{background:var(--redT);color:var(--red)}
  .chip.lv{background:var(--goldT);color:var(--gold)}
  tr.r-hol td:first-child{box-shadow:inset 3px 0 0 var(--red),1px 0 0 var(--rule)}
  tr.r-sat td:first-child{box-shadow:inset 3px 0 0 var(--green),1px 0 0 var(--rule)}
  tr.r-lv td:first-child{box-shadow:inset 3px 0 0 var(--goldBar),1px 0 0 var(--rule)}
  .hrs{width:68px;text-align:right;font-family:var(--mono);background:var(--blueT);border:1px solid var(--blueB)}
  .hrs:hover{background:#dfe9f8}
  .nt{width:100%;min-width:150px;border:1px solid transparent;background:transparent;font-size:12px;padding:5px 7px;border-radius:6px}
  .nt:hover{border-color:var(--rule);background:#fff}
  .holname{font:600 10px/1 var(--mono);color:var(--red);text-transform:uppercase;letter-spacing:.06em}
  .workname{font:600 10px/1 var(--mono);color:var(--green);text-transform:uppercase;letter-spacing:.06em}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:15px 17px;box-shadow:var(--sh)}
  .kpi .lb{font:600 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
  .kpi .vl{font:700 22px/1.1 var(--mono);letter-spacing:-.028em;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--navyD)}
  .kpi .fn{font-size:11px;color:var(--ink3);margin-top:7px}
  .kpi .fn b{color:var(--ink2);font-weight:600}
  .kpi.accent{background:linear-gradient(135deg,var(--navy1),var(--navy2));border-color:var(--navy1);color:#fff}
  .kpi.accent .lb{color:#b7c5e2}.kpi.accent .fn{color:#b7c5e2}.kpi.accent .vl{color:#fff}
  .kpi.accent .fn b{color:#fff}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;font-size:12.5px}
  .kv label{color:var(--ink2)}
  .kv input{width:106px;text-align:right;font-family:var(--mono)}
  .kv .ro{width:106px;text-align:right;font-family:var(--mono);font-weight:600;color:var(--navyD);background:var(--hdbg);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font-size:13px}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font:600 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
  .fld.wide{grid-column:1/-1}
  .warn{background:var(--goldT);border-left:3px solid var(--goldBar);padding:12px 15px;font-size:12px;line-height:1.65;color:#6b4d05;border-radius:6px}
  .formula{font:400 11.5px/1.6 var(--mono);color:var(--ink2);background:var(--hdbg);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-top:12px}
  .prose{font-size:13px;line-height:1.7;color:var(--ink2);max-width:74ch}
  .prose h4{margin:18px 0 6px;font-size:12.5px;color:var(--ink);font-weight:600}
  .prose h4:first-child{margin-top:0}
  .rolebadge{display:inline-block;font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:4px;background:var(--blueT);color:var(--navyD)}
  .file{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--hdbg);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:12.5px}
  .file .nm{font-family:var(--mono);color:var(--navyD);font-weight:600}

  /* login */
  .app.locked .hdr,.app.locked .tabs{display:none}
  .app.locked .body{padding:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy1),var(--navy2))}
  .login{background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(8,18,40,.35);padding:28px;width:340px;max-width:92vw}
  .login .lg{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .login .lg .logo{box-shadow:none;border:1px solid var(--rule)}
  .login .lg b{font-size:14px;letter-spacing:-.01em;display:block}
  .login .lg span{font:400 10.5px/1.5 var(--mono);color:var(--ink3)}
  .login .fld{margin-bottom:13px}
  .login input{width:100%}
  .login .btn{width:100%;padding:10px;font-size:13px;margin-top:6px}
  .login .err{background:var(--redT);color:var(--red);font-size:12px;padding:9px 11px;border-radius:6px;margin-bottom:13px}

  /* record card, following the portal's client record layout */
  .rec{position:sticky;top:-20px;z-index:20;background:var(--page);margin:-20px -22px 16px;padding:14px 22px 0}
  .rec-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .rec-top h2{font-size:19px;font-weight:700;letter-spacing:-.015em;color:var(--navyD)}
  .code{font:600 11px/1 var(--mono);letter-spacing:.06em;background:var(--navyD);color:#fff;padding:7px 10px;border-radius:5px}
  .spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}
  .spill.on{background:var(--greenT);color:var(--green)}
  .spill.off{background:#eef1f6;color:var(--ink3)}
  .spill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .rec-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .rec-act .grp{display:flex;gap:8px;flex-wrap:wrap}
  .rec-tabs{display:flex;gap:2px;margin-top:12px;border-bottom:1px solid var(--rule);overflow-x:auto}
  .rec-tabs button{background:none;border:0;padding:11px 13px 9px;font-size:13px;color:#5b6b83;
    border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
  .rec-tabs button:hover{color:var(--navyD)}
  .rec-tabs button[aria-current="true"]{color:var(--navyD);font-weight:600;border-bottom-color:var(--navyD)}

  /* T.D.59A form layout */
  .form59 .sec{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;
    background:var(--navyD);padding:9px 14px;border-radius:5px;margin:18px 0 0}
  .form59 .sec:first-child{margin-top:0}
  .f59{width:100%;border-collapse:collapse;font-size:12.5px}
  .f59 th{background:var(--hdbg);font:600 9px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;
    color:var(--label);padding:8px 10px;text-align:right;border-bottom:1px solid var(--rule)}
  .f59 th:first-child{text-align:left}
  .f59 td{padding:5px 10px;border-bottom:1px solid #eef1f6;vertical-align:middle}
  .f59 td:first-child{color:var(--ink2);line-height:1.45}
  .f59 td.n{width:34px;color:var(--ink3);font-family:var(--mono);text-align:right;padding-right:4px}
  .f59 input{width:118px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:5px 8px}
  .f59 .ro{width:118px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:6px 8px;
    background:var(--hdbg);border:1px solid var(--rule);border-radius:5px;color:var(--navyD);font-weight:600}
  .f59 tr.calc td{background:var(--zebra)}
  .f59 tr.res td{background:var(--hdbg);font-weight:600;color:var(--navyD)}
  .f59 .cell{display:flex;justify-content:flex-end}

  /* payslip */
  .payslip{padding:0;overflow:hidden}
  .sl-top{background:linear-gradient(90deg,var(--navy1),var(--navy2));color:#fff;padding:15px 20px;display:flex;align-items:flex-start;gap:14px}
  .sl-co{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .sl-addr{font:400 10.5px/1.6 var(--mono);color:#c2cfe9;margin-top:5px;white-space:pre-line}
  .sl-sub{font:400 11.5px/1.5 var(--mono);color:#dbe4f5;margin-top:7px}
  .sl-badge{margin-left:auto;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:7px 11px;border-radius:999px;flex:none}
  .sl-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border-bottom:1px solid var(--rule)}
  .sl-meta > div{background:var(--hdbg);padding:11px 20px}
  .sl-meta span{display:block;font:600 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--label)}
  .sl-meta b{display:block;font-size:13px;margin-top:6px;color:var(--ink)}
  .sl-cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule)}
  .sl-col{background:#fff;padding:16px 20px}
  .sl-h{font:600 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--label);margin-bottom:12px}
  .sl-row{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid #f1f4f8;font-size:12.5px}
  .sl-row:last-child{border-bottom:0}
  .sl-lb{flex:1;color:var(--ink2)}
  .sl-lb em{display:block;font-style:normal;font:400 10.5px/1.5 var(--mono);color:var(--ink3);margin-top:3px}
  .sl-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}
  .sl-row.strong{border-top:1.5px solid var(--navyD);border-bottom:0;margin-top:6px;padding-top:9px;font-weight:600;color:var(--navyD)}
  .sl-row.strong .sl-lb{color:var(--navyD)}
  .sl-net{background:var(--navyD);color:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:space-between}
  .sl-net span{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#b7c5e2}
  .sl-net b{font:700 21px/1 var(--mono);letter-spacing:-.025em}
  .sl-foot{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
  .sl-fcol{background:#fff;padding:16px 20px}
  .sl-mini{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:12px;align-items:baseline}
  .sl-mini span{color:var(--ink2)}

<script>
(function(){
  "use strict";
  var KEY="payroll_2026", YEAR=2026;
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MSHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var HOL_DEFAULT={
    "2026-01-01":"New Year's Day","2026-01-06":"Epiphany","2026-02-23":"Clean Monday",
    "2026-03-25":"Greek Independence Day","2026-04-01":"EOKA Day","2026-04-10":"Good Friday",
    "2026-04-13":"Easter Monday","2026-04-14":"Easter Tuesday","2026-05-01":"Labour Day",
    "2026-06-01":"Whit Monday","2026-08-15":"Assumption Day","2026-10-01":"Independence Day",
    "2026-10-28":"Ochi Day","2026-12-25":"Christmas Day","2026-12-26":"Boxing Day"
  };
  function defaultHolidays(){
    var o={}; Object.keys(HOL_DEFAULT).forEach(function(k){ o[k]={name:HOL_DEFAULT[k],work:false}; }); return o;
  }

  // Every absence reduces pay from this employer: annual leave is met by the Central
  // Holiday Fund and sick leave by Social Insurance, so neither is paid by the company.
  var ABSTYPES=[
    {k:"V",label:"Annual leave",       si:"V", hint:"paid by the Central Holiday Fund"},
    {k:"S",label:"Sick leave",         si:"A", hint:"paid by Social Insurance"},
    {k:"M",label:"Maternity/paternity",si:"M", hint:"paid by Social Insurance"},
    {k:"U",label:"Unpaid leave",       si:"A", hint:"not paid by anyone"}
  ];
  function absType(k){ for(var i=0;i<ABSTYPES.length;i++) if(ABSTYPES[i].k===k) return ABSTYPES[i]; return null; }
  var SEED_ENTRIES = {};  // per-client data lives in the portal, not in the template

  var DEFAULTS={
    employer:{name:"",reg:"",tic:"",siReg:"",address:"",phone:"",email:"",contact:"",contactTel:""},
    employees:[],
    users:[{u:"Admin",p:"Admin",name:"Administrator",role:"admin"}],
    rates:{siEE:8.8, siER:8.8, holER:8, redER:1.2, itfER:0.5, scfER:2, ghsEE:2.65, ghsER:2.9},
    params:{stdDay:8, stdMonth:176, capMonth:5742, capWeek:1325, ghsCapYear:180000, recording:"exceptions",
      stdBasis:"calendar", weekEnd:6, payLag:7},
    paye:{enabled:true, borneBy:"employee", method:"td59", periods:13, employerType:"Private Sector",
      bands:[{upTo:22000,rate:0},{upTo:32000,rate:20},{upTo:42000,rate:25},{upTo:72000,rate:30},{upTo:0,rate:35}]},
    holidays:defaultHolidays(),
    updated:null, entries:{}
  };

  var TABS=[["sheet","Timesheet"],["month","Monthly summary"],["year","Annual summary"],["reports","Reports"],["employees","Employees"],["data","Data & exports"]];
  var S=null, me=null, view="sheet", curEmp="andri", curMonth=new Date().getMonth();
  var reportKind="payslips", slipEmp="all", cardEmp=null, loginErr="";
  var $body=document.getElementById("body"), $tabs=document.getElementById("tabs"), $app=document.getElementById("app");
  var $menu=document.getElementById("acctMenu"), $acctBtn=document.getElementById("acctBtn");
  var $acctName=document.getElementById("acctName"), $stamp=document.getElementById("stamp");
  var $hTitle=document.getElementById("hTitle"), $logo=document.getElementById("logoTile");
  var opened=new Date();

  /* ---------- calendar ---------- */
  function absKey(m){ return YEAR+"-"+String(m+1).padStart(2,"0"); }
  function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  var CAL=[];
  (function(){ var d=new Date(YEAR,0,1);
    while(d.getFullYear()===YEAR){ if(d.getDay()!==0) CAL.push({iso:iso(d),m:d.getMonth(),dow:d.getDay(),day:DAYS[d.getDay()]}); d.setDate(d.getDate()+1); }
  })();
  function monthDays(m){ return CAL.filter(function(c){return c.m===m;}); }
  function weeks(){
    var we=Number(S.params.weekEnd); if(isNaN(we)) we=6;
    var lag=Number(S.params.payLag)||0, out=[];
    var d=new Date(YEAR,0,1);
    while(d.getFullYear()===YEAR){
      if(d.getDay()===we){
        var end=new Date(d), start=new Date(d); start.setDate(start.getDate()-6);
        var pay=new Date(d); pay.setDate(pay.getDate()+lag);
        out.push({start:iso(start),end:iso(end),pay:iso(pay),
          days:CAL.filter(function(c){ return c.iso>=iso(start) && c.iso<=iso(end); })});
      }
      d.setDate(d.getDate()+1);
    }
    return out;
  }
  function weekDetail(e,wk){
    var std=stdHoursFor(e,wk.days), ot=0, abs=0;
    wk.days.forEach(function(c){ var d=dayRaw(e,c); ot=r2(ot+(d.ot||0)); abs=r2(abs+(d.abs||0)); });
    var started = !e.dateEmployed || e.dateEmployed<=wk.end;
    var left = e.dateLeft && e.dateLeft<wk.start;
    var base = (e.active===false||left||!started) ? 0 : std;
    var paid=r2(Math.max(0,base-abs)+ot);
    var target = e.type==="FIXED" ? r2((Number(e.net)||0)*12/52*(std?paid/std:0)) : r2(paid*(Number(e.net)||0));
    var gross = grossForNet(target,"W");
    var c=contribs(gross,"W");
    c.std=base; c.absHrs=abs; c.otHrs=ot; c.paidHrs=paid; c.target=target;
    return c;
  }
  function hol(i){ return S.holidays ? S.holidays[i] : null; }
  function isHoliday(i){ var x=hol(i); return !!x && !x.work; }
  function dayType(c,e){
    if(isHoliday(c.iso)) return "hol";
    if(c.dow===6) return (e && weekDays(e)>=6) ? "wd" : "sat";
    return "wd";
  }
  function isWorkDay(c,e){ return dayType(c,e)==="wd"; }

  /* ---------- payroll engine ---------- */
  function emp(id){ for(var i=0;i<S.employees.length;i++) if(S.employees[i].id===id) return S.employees[i]; return null; }
  function r2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
  // Net -> gross divisor, derived from the statutory rates in Settings.
  // SI and GHS are charged on gross + holiday fund; net = gross - employee SI - employee GHS.
  // net = gross - gross*(1 + hol%)*(siEE% + ghsEE%)  =>  divisor = 1 - (1 + hol%)*(siEE% + ghsEE%)
  function divisor(){
    var R=S.rates;
    var d=1-(1+(Number(R.holER)||0)/100)*((Number(R.siEE)||0)+(Number(R.ghsEE)||0))/100;
    return d>0?d:1;
  }
  function weekHours(e){ return Number(e.weekHours)|| (String(e.weekPattern)==="6"?46:40); }
  function weekDays(e){ return Number(e.weekPattern)||5; }
  function stdDayHours(e){ var d=weekDays(e); return d?r2(weekHours(e)/d):8; }
  function stdBasis(e){ return e.stdBasis || S.params.stdBasis || "calendar"; }
  function workDaysIn(days,e){ var n=0; days.forEach(function(c){ if(isWorkDay(c,e)) n++; }); return n; }
  function stdHoursFor(e,days){
    if(stdBasis(e)==="fixed") return Number(e.stdMonth)||Math.round(weekHours(e)*52/12);
    return r2(workDaysIn(days,e)*stdDayHours(e));
  }
  function stdMonthHours(e,m){
    if(m===undefined) return Number(e.stdMonth)||Math.round(weekHours(e)*52/12);
    return stdHoursFor(e,monthDays(m));
  }
  function exceptionMode(){ return (S.params.recording||"exceptions")==="exceptions"; }
  function monthRecording(e,m){
    var d=S.entries[e.id];
    if(!d) return S.params.recording||"exceptions";
    var hasExc=false, hasH=false;
    monthDays(m).forEach(function(c){
      var x=d[c.iso]; if(!x) return;
      if(x.ot!==undefined||x.ab!==undefined) hasExc=true;
      if(x.h!==undefined && x.h!=="") hasH=true;
    });
    if(hasExc) return "exceptions";
    if(hasH) return "hours";
    return S.params.recording||"exceptions";
  }
  function grossRate(e){
    if(e.type==="FIXED") return (Number(e.net)||0)/divisor();
    return (Number(e.net)||0)/divisor();
  }
  function otRate(e){ return e.type==="FIXED" ? grossRate(e)/(Number(e.stdMonth)||Math.round(weekHours(e)*52/12)) : grossRate(e); }
  // Bases: social insurance, redundancy and training are capped at the monthly (or weekly)
  // maximum insurable earnings; social cohesion is not capped; GHS has its own annual cap.
  function bases(gross,payInd){
    var R=S.rates, h=r2(gross*R.holER/100), base=r2(gross+h);
    var cap = payInd==="W" ? (Number(S.params.capWeek)||0) : (Number(S.params.capMonth)||0);
    var gcap = (Number(S.params.ghsCapYear)||0)/12;
    return {hol:h, base:base,
      insurable: cap ? Math.min(base,cap) : base,
      ghsBase:   gcap ? Math.min(base,gcap) : base};
  }
  function netOf(gross,payInd){
    var R=S.rates, b=bases(gross,payInd);
    return r2(gross - r2(b.insurable*R.siEE/100) - r2(b.ghsBase*R.ghsEE/100));
  }
  // The client pays an agreed NET rate, so gross is the derived figure: find the gross,
  // to the cent, whose net equals the agreed net exactly.
  function grossForNet(target,payInd){
    target=r2(target);
    if(!target) return 0;
    var g0=r2(target/divisor());
    if(netOf(g0,payInd)<target-0.005){            // capped: deductions stop rising, widen by bisection
      var lo=g0, hi=g0+target, i;
      for(i=0;i<60;i++){ var mid=(lo+hi)/2; if(netOf(r2(mid),payInd)<target) lo=mid; else hi=mid; }
      g0=r2(hi);
    }
    var best=g0, bestd=Infinity;
    for(var j=-4;j<=4;j++){
      var g=r2(g0+j/100), d=Math.abs(netOf(g,payInd)-target);
      if(d<bestd-1e-9 || (Math.abs(d-bestd)<1e-9 && Math.abs(g-g0)<Math.abs(best-g0))){ bestd=d; best=g; }
    }
    return best;
  }
  function entry(id,i){ var d=S.entries[id]; return (d&&d[i])||{}; }
  function dayRaw(e,c,mode){
    var en=entry(e.id,c.iso), t=dayType(c,e);
    if((mode||monthRecording(e,c.m))==="exceptions"){
      var ot2=(en.ot===undefined||en.ot===null||en.ot==="")?null:Number(en.ot);
      var ab=(en.ab===undefined||en.ab===null||en.ab==="")?null:Number(en.ab);
      var sd=stdDayHours(e);
      var worked = t==="wd" ? Math.max(0, r2(sd-(ab||0)+(ot2||0))) : (ot2||0);
      return {type:t, ot:ot2||0, abs:ab||0, at:en.at||"", hours:null, worked:worked, normal:0,
        nEarn:0, oEarn:(ot2||0)*otRate(e), gross:0, note:en.n||""};
    }
    var h=(en.h===undefined||en.h===null||en.h==="")?null:Number(en.h);
    var std=Number(S.params.stdDay)||8, normal=0, ot=0;
    if(h!==null){ if(t==="wd"){ normal=Math.min(h,std); ot=Math.max(0,h-std); } else { ot=h; } }
    var nEarn = e.type==="FIXED" ? 0 : normal*grossRate(e);
    var oEarn = ot*otRate(e);
    return {hours:h,type:t,normal:normal,ot:ot,abs:0,at:"",worked:h||0,nEarn:nEarn,oEarn:oEarn,gross:nEarn+oEarn,note:en.n||""};
  }
  // Month detail: gross solved from the agreed net, then the daily earnings columns are
  // scaled so they foot exactly to that gross.
  var MDCACHE={}, MDBUSY={};
  function monthDetail(e,m){
    var key=e.id+"|"+m;
    if(MDCACHE[key]) return MDCACHE[key];
    if(MDBUSY[key]) return monthDetailCalc(e,m,true);   // re-entry: pre-tax basis, no gross-up
    MDBUSY[key]=1;
    var res;
    try{ res=monthDetailCalc(e,m,false); } finally { delete MDBUSY[key]; }
    MDCACHE[key]=res;
    return res;
  }
  function monthDetailCalc(e,m,noGrossUp){
    var mode=monthRecording(e,m);
    var rows=monthDays(m).map(function(c){ return {c:c,d:dayRaw(e,c,mode)}; });
    var hours=0,normal=0,ot=0,raw=0,absH=0;
    var workedH=0;
    rows.forEach(function(x){ hours+=x.d.hours||0; normal+=x.d.normal; ot+=x.d.ot; raw+=x.d.gross; absH+=x.d.abs||0; workedH+=x.d.worked||0; });
    var stdM=Number(S.params.stdMonth)||176, stdEmp=stdMonthHours(e,m), paid=0;
    var bonus = (S.bonus && S.bonus[e.id] && S.bonus[e.id][absKey(m)] && Number(S.bonus[e.id][absKey(m)].amt)) || 0;
    var target;
    if(mode==="exceptions"){
      var started = !e.dateEmployed || e.dateEmployed<=(absKey(m)+"-31");
      var left = e.dateLeft && e.dateLeft<(absKey(m)+"-01");
      var base = (e.active===false||left||!started) ? 0 : stdEmp;
      paid = Math.max(0, base-absH) + ot;
      normal = Math.max(0, base-absH); hours = paid;
      target = (e.type==="FIXED" ? (Number(e.net)||0)*(stdEmp?paid/stdEmp:0) : paid*(Number(e.net)||0)) + bonus;
    } else {
      target = (e.type==="FIXED" ? (Number(e.net)||0)*(1+(stdM?ot/stdM:0)) : hours*(Number(e.net)||0)) + bonus;
    }
    var gross = grossForNet(target,e.payInd||"M");
    if(!noGrossUp && S.paye && S.paye.enabled && S.paye.borneBy==="employer" && target && payeAt(e,m,gross)>0){
      // net after tax rises with gross, so bisect for the gross that delivers the agreed net
      var lo=gross, hi=r2(gross*1.8), k;
      for(k=0;k<50;k++){
        var mid=(lo+hi)/2, cM=contribs(r2(mid),e.payInd||"M");
        if(r2(mid)-cM.eeSI-cM.ghsEE-payeAt(e,m,r2(mid)) < target) lo=mid; else hi=mid;
      }
      var best=r2(hi), bd=Infinity;
      for(k=-3;k<=3;k++){
        var g2=r2(hi+k/100), c2=contribs(g2,e.payInd||"M");
        var d2=Math.abs(r2(g2-c2.eeSI-c2.ghsEE-payeAt(e,m,g2))-target);
        if(d2<bd-1e-9){ bd=d2; best=g2; }
      }
      gross=best;
    }
    var nE=0,oE=0;
    if(mode==="exceptions"){
      var otR=otRate(e);
      rows.forEach(function(x){ x.d.oEarn=r2((x.d.ot||0)*otR); x.d.gross=x.d.oEarn; oE=r2(oE+x.d.oEarn); });
      nE=r2(gross-oE);
      return {rows:rows,hours:hours,normal:normal,ot:ot,abs:r2(absH),std:stdEmp,paid:paid,worked:r2(workedH),
              nEarn:nE,oEarn:oE,gross:gross,target:r2(target),bonus:r2(bonus)};
    }
    if(e.type!=="FIXED"){
      var k = raw ? gross/raw : 1, last=null;
      rows.forEach(function(x){
        if(x.d.hours){ x.d.nEarn=r2(x.d.nEarn*k); x.d.oEarn=r2(x.d.oEarn*k);
          x.d.gross=r2(x.d.nEarn+x.d.oEarn); nE+=x.d.nEarn; oE+=x.d.oEarn; last=x; }
        else { x.d.nEarn=0; x.d.oEarn=0; x.d.gross=0; }
      });
      var diff=r2(gross-r2(nE+oE));
      if(last && diff){
        if(last.d.normal){ last.d.nEarn=r2(last.d.nEarn+diff); nE=r2(nE+diff); }
        else { last.d.oEarn=r2(last.d.oEarn+diff); oE=r2(oE+diff); }
        last.d.gross=r2(last.d.nEarn+last.d.oEarn);
      }
      nE=r2(nE); oE=r2(oE);
    } else {
      rows.forEach(function(x){ x.d.oEarn=r2(x.d.oEarn); x.d.gross=x.d.oEarn; oE=r2(oE+x.d.oEarn); });
      nE=r2(gross-oE);
    }
    return {rows:rows,hours:hours,normal:normal,ot:ot,abs:r2(absH),std:stdEmp,paid:hours,worked:r2(workedH),nEarn:nE,oEarn:oE,gross:gross,target:r2(target),bonus:r2(bonus)};
  }
  function monthCalc(e,m){ return monthDetail(e,m); }
  function payeAt(e,m,gross){                        // tax for a trial gross, used when grossing up
    if(!S.paye||!S.paye.enabled) return 0;
    var c=contribs(gross,e.payInd||"M");
    var taxable=r2(gross-c.eeSI-c.ghsEE);
    if(S.paye.method==="td59"){ var t=td59Calc(e,m); return t?t.C3:0; }
    if(S.paye.method==="annualised") return r2(annualTax(taxable*12)/12);
    var ytd=0, paid=0, i;
    for(i=0;i<m;i++){ var x=taxableOf(e,i); ytd=r2(ytd+x.taxable); paid=r2(paid+payeFor(e,i)); }
    ytd=r2(ytd+taxable);
    var months=m+1, due=r2(annualTax(ytd*12/months)*months/12);
    var t=r2(due-paid); return t>0?t:0;
  }
  function contribs(gross,payInd){
    var R=S.rates;
    gross=r2(gross);
    var b=bases(gross,payInd), h=b.hol, ins=b.insurable, gb=b.ghsBase;
    var eeSI=r2(ins*R.siEE/100), ghsEE=r2(gb*R.ghsEE/100), ded=r2(eeSI+ghsEE);
    var erSI=r2(ins*R.siER/100), ghsER=r2(gb*R.ghsER/100);
    var red=r2(ins*R.redER/100), itf=r2(ins*R.itfER/100);
    var scf=r2(b.base*R.scfER/100);            // social cohesion is not capped
    return {gross:gross,hol:h,base:b.base,insurable:ins,ghsBase:gb,
            eeSI:eeSI,ghsEE:ghsEE,ded:ded,net:r2(gross-ded),
            erSI:erSI,red:red,itf:itf,scf:scf,ghsER:ghsER,
            cost:r2(gross+erSI+h+red+itf+scf+ghsER)};
  }
  // Cyprus PAYE: progressive on taxable income, which is gross less the employee's own
  // social insurance and GHS. Bands and method are set in Settings.
  function annualTax(taxable){
    var bands=(S.paye&&S.paye.bands)||[], t=0, prev=0;
    for(var i=0;i<bands.length;i++){
      var cap=Number(bands[i].upTo)||Infinity, rate=(Number(bands[i].rate)||0)/100;
      if(taxable>prev) t+=(Math.min(taxable,cap)-prev)*rate;
      prev=cap;
      if(taxable<=cap) break;
    }
    return t;
  }
  // Form T.D.59A: build the year, apply the declared allowances, tax the chargeable
  // income, take the share relating to this employer, then divide by the pay periods.
  function td59Year(e,m){
    var ytdG=0,ytdSI=0,ytdGHS=0,i;
    for(i=0;i<=m;i++){ var mc=monthDetail(e,i), c=contribs(mc.gross,e.payInd||"M");
      ytdG=r2(ytdG+mc.gross); ytdSI=r2(ytdSI+c.eeSI); ytdGHS=r2(ytdGHS+c.ghsEE); }
    var f=12/(m+1);
    return {A1:r2(ytdG*f), si:r2(ytdSI*f), ghs:r2(ytdGHS*f)};
  }
  function td59Calc(e,m){
    var d=e.td59||{}, a=td59Year(e,m), N=function(k){ return Number(d[k])||0; };
    var A1=a.A1, A6=r2(A1+N("A2")+N("A3")+N("A4")+N("A5"));
    if(!A6) return null;
    var A8=r2(A6-N("A7"));
    var B1to5=r2(N("B1")+N("B2")+N("B3")+N("B4")+N("B5"));
    var B6=r2(A8-B1to5);
    var B7=r2(a.si+N("B7")), B8=r2(a.ghs+N("B8")), B9=N("B9");
    var cap=r2(B6/5), claimed=r2(B7+B8+B9), allowed=Math.min(claimed,cap);
    var B1013=r2(N("B10")+N("B11")+N("B12")+N("B13"));
    var B15=r2(B1to5+allowed+B1013), B16=r2(A8-B15);
    if(B16<0) B16=0;
    var C1=r2(annualTax(B16));
    var C2=r2(C1*(A1+N("A2")+N("A3"))/A6);
    var periods=(e.payInd==="W")?52:(Number(e.periods)||Number(S.paye.periods)||13);
    return {A1:A1,A6:A6,A8:A8,B6:B6,B7:B7,B8:B8,B9:B9,claimed:claimed,cap:cap,allowed:allowed,
      restricted:claimed>cap, B15:B15,B16:B16,C1:C1,C2:C2,periods:periods,C3:r2(C2/periods)};
  }
  var PCACHE={};
  function clearCache(){ PCACHE={}; MDCACHE={}; MDBUSY={}; }
  function taxableOf(e,m){
    var mc=monthDetail(e,m), c=contribs(mc.gross,e.payInd||"M");
    return {taxable:r2(mc.gross-c.eeSI-c.ghsEE), gross:mc.gross};
  }
  function payeFor(e,m){
    if(!S.paye||!S.paye.enabled) return 0;
    var key=e.id+"|"+m;
    if(PCACHE[key]!==undefined) return PCACHE[key];
    if(!monthDetail(e,m).gross) return 0;        // nothing paid this period, nothing to withhold
    PCACHE[key]=0;                                   // guard against re-entry
    var ytd=0, paid=0, any=false, i;
    for(i=0;i<=m;i++){
      var x=taxableOf(e,i);
      ytd=r2(ytd+x.taxable);
      if(x.gross) any=true;
      if(i<m) paid=r2(paid+payeFor(e,i));
    }
    if(!any){ PCACHE[key]=0; return 0; }
    var months=m+1, due;
    if(S.paye.method==="td59"){
      var t59=td59Calc(e,m);
      PCACHE[key]= t59 && t59.C3>0 ? t59.C3 : 0;
      return PCACHE[key];
    }
    if(S.paye.method==="annualised"){
      var x2=taxableOf(e,m);
      due=r2(annualTax(x2.taxable*12)/12);
      PCACHE[key]=due>0?due:0; return PCACHE[key];
    }
    var projected = ytd*12/months;                   // cumulative: project the year, take the share earned
    due = r2(annualTax(projected)*months/12);
    var thisMonth = r2(due-paid);
    if(thisMonth<0) thisMonth=0;
    PCACHE[key]=thisMonth;
    return thisMonth;
  }
  function empMonth(e,m){
    var mc=monthDetail(e,m), c=contribs(mc.gross,e.payInd||"M");
    c.paye=payeFor(e,m);
    c.ded=r2(c.eeSI+c.ghsEE+c.paye);
    c.net=r2(c.gross-c.ded);
    c.taxable=r2(c.gross-c.eeSI-c.ghsEE);
    c.normalHrs=mc.normal; c.otHrs=mc.ot; c.hours=mc.hours; c.target=mc.target;
    c.nEarn=mc.nEarn; c.oEarn=mc.oEarn; c.bonus=mc.bonus;
    c.absHrs=mc.abs||0; c.stdHrs=mc.std||0; c.paidHrs=mc.paid||0; c.workedHrs=mc.worked||0; return c;
  }

  /* ---------- convert recorded hours into exceptions ---------- */
  function monthHasHours(e,m){
    var d=S.entries[e.id]; if(!d) return false;
    var any=false;
    monthDays(m).forEach(function(c){ var x=d[c.iso]; if(x && x.h!==undefined && x.h!=="") any=true; });
    return any;
  }
  function convertMonth(e,m,write){
    if(!monthHasHours(e,m)) return null;
    var d=S.entries[e.id], sd=stdDayHours(e), recorded=0, ot=0, abs=0, plan=[];
    monthDays(m).forEach(function(c){
      var x=d[c.iso]||{}, has=(x.h!==undefined && x.h!=="");
      var hh=has?Number(x.h):0;
      recorded+=hh;
      if(isWorkDay(c,e)){
        var o=Math.max(0,r2(hh-sd)), a=Math.max(0,r2(sd-hh));
        ot=r2(ot+o); abs=r2(abs+a);
        plan.push({iso:c.iso,ot:o,ab:a,at:a?(x.n&&/sick/i.test(x.n)?"S":(x.n&&/annual/i.test(x.n)?"V":"U")):"",note:x.n||""});
      } else if(hh){
        ot=r2(ot+hh);
        plan.push({iso:c.iso,ot:hh,ab:0,at:"",note:x.n||""});
      }
    });
    var std=stdHoursFor(e,monthDays(m));
    var paid=r2(Math.max(0,std-abs)+ot);
    if(write){
      plan.forEach(function(p){
        if((p.ot||p.ab) && !d[p.iso]) d[p.iso]={};      // a working day with no record at all
        if(p.ot){ d[p.iso].ot=p.ot; } else if(d[p.iso]) delete d[p.iso].ot;
        if(p.ab){ d[p.iso].ab=p.ab; d[p.iso].at=p.at||"U"; }
        else if(d[p.iso]){ delete d[p.iso].ab; delete d[p.iso].at; }
        if(d[p.iso] && !Object.keys(d[p.iso]).length) delete d[p.iso];   // h is kept as the original record
      });
    }
    return {recorded:r2(recorded),std:std,ot:ot,abs:abs,paid:paid,ok:Math.abs(paid-recorded)<0.005};
  }

  /* ---------- social insurance schedule and text file ---------- */
  function derivedWeeks(e,m){
    var out=["","","","",""], buckets=[[],[],[],[],[]];
    monthDays(m).forEach(function(c){
      if(!isWorkDay(c,e)) return;
      var wk=Math.min(4,Math.floor((parseInt(c.iso.slice(8),10)-1)/7));
      buckets[wk].push(dayRaw(e,c));
    });
    buckets.forEach(function(days,i){
      if(!days.length){ out[i]=" "; return; }
      var full=days.every(function(d){ return (d.abs||0)>0; });
      if(!full){ out[i]=" "; return; }
      var t=absType(days[0].at)||absType("U");
      out[i]=t.si;
    });
    return out.join("");
  }
  function absWeeks(e,m){
    var a=S.absent&&S.absent[e.id]&&S.absent[e.id][absKey(m)];
    if(a) return String(a).padEnd(5," ").slice(0,5);
    if(monthRecording(e,m)==="exceptions") return derivedWeeks(e,m);
    return "     ";

  function setAbsWeek(e,m,i,v){
    if(!S.absent) S.absent={};
    if(!S.absent[e.id]) S.absent[e.id]={};

    cur[i]=v||" ";
    var s=cur.join("");

    save();
  }

      g.tot.act+=act; g.tot.ghs+=ghsE; g.tot.ins+=insE; g.tot.chf=r2(g.tot.chf+chf);

  /* fixed-width helpers for the SI text file */
  function fA(v,n){ return String(v==null?"":v).slice(0,n).padEnd(n," "); }              // alphanumeric, blank filled
  function digits(v){ return String(v==null?"":v).replace(/[^0-9]/g,""); }
  function fN(v,n){ var d=digits(v); return (d.length>n?d.slice(-n):d).padStart(n,"0"); }  // numeric, zero filled
  function fS(v,n){ var d=n-1; return ((Number(v)||0)<0?"-":"+")+fN(v,d); }              // signed, S + digits
  function fSc(v,n){ var d=n-1; var c=Math.round((Number(v)||0)*100); return (c<0?"-":"+")+String(Math.abs(c)).padStart(d,"0"); }
  function siRegFmt(v){
    var p=String(v||"").split("/");
    if(p.length!==3) return String(v||"");
    return digits(p[0]).padStart(8,"0")+"/"+digits(p[1]).padStart(1,"0")+"/"+digits(p[2]).padStart(4,"0");
  }
  function siFile(m){
    var er=S.employer||{}, out=[], groups=siRows(m);
    var d=new Date(), dp=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
    out.push("01"+fA("S.I.S. SCHEDULE",25)+"01"+fA(dp,10)+fA(er.contact||er.name||"",30)+fA(er.contactTel||er.phone||"",20));
    var G={act:0,ghs:0,ins:0,chf:0,newE:0,term:0,emp:0};
    groups.forEach(function(g){
      out.push("02"+fA(siRegFmt(er.siReg),15)+fA(g.cat,2)+"K"+fA(String(m+1).padStart(2,"0")+"/"+YEAR,7)+fA("",7)+fA("",7));
      g.rows.forEach(function(x){
        var e=x.e;
        if(e.dateEmployed && e.dateEmployed.slice(0,7)===absKey(m)){
          out.push("03"+fN(e.siNo,8)+fN(e.idNo,8)+fN(e.arcNo,8)+fA(e.passport||"",10)+
            fA(e.fullName||e.name,30)+fA(e.dob?ddmmyy(e.dob):"",10)+fA(e.gender||"",1)+
            fA(e.community||"E",1)+fA(ddmmyy(e.dateEmployed),10)+fA(e.payInd||"M",1)+
            fA(e.chfExempt||"0",1)+fA(e.occupation||"",25));
        }
      });
      g.rows.forEach(function(x){
        var e=x.e;
        out.push("04"+fN(e.siNo,8)+fN(e.idNo,8)+fN(e.arcNo,8)+fS(x.act,11)+fS(x.ghs,11)+fS(x.ins,11)+
          fSc(x.chf,13)+x.abs+fA(e.dateLeft?ddmmyy(e.dateLeft):"",10)+"1");
      });
      out.push("05"+fS(g.tot.act,13)+fS(g.tot.ghs,13)+fS(g.tot.ins,13)+fSc(g.tot.chf,15)+
        fN(g.tot.newE,5)+fN(g.tot.term,5)+fN(g.rows.length,6));
      G.act+=g.tot.act; G.ghs+=g.tot.ghs; G.ins+=g.tot.ins; G.chf=r2(G.chf+g.tot.chf);
      G.newE+=g.tot.newE; G.term+=g.tot.term; G.emp+=g.rows.length;
    });
    out.push("06"+fS(G.act,13)+fS(G.ghs,13)+fS(G.ins,13)+fSc(G.chf,15)+
      fN(G.newE,5)+fN(G.term,5)+fN(G.emp,6)+fN(groups.length,2));
    return out.join("\r\n");
  }

    grossRate:grossRate,otRate:otRate,dayType:dayType,
    boot:function(){ S=JSON.parse(JSON.stringify(DEFAULTS)); me=S.users[0]; },
    state:function(){ return S; }};

  /* ---------- boot ---------- */
  load().then(function(saved){
    S = saved || JSON.parse(JSON.stringify(DEFAULTS));
    if(!S.entries) S.entries={};
    if(!S.params) S.params=DEFAULTS.params;
    if(!S.rates) S.rates=DEFAULTS.rates;
    if(!S.employer) S.employer=JSON.parse(JSON.stringify(DEFAULTS.employer));
    if(!S.users||!S.users.length) S.users=JSON.parse(JSON.stringify(DEFAULTS.users));
    if(!S.holidays) S.holidays=defaultHolidays();
    if(!S.paye) S.paye=JSON.parse(JSON.stringify(DEFAULTS.paye));
    S.params.recording="exceptions";
    S.employees.forEach(function(e){                       // lossless: the daily hours stay put
      for(var m=0;m<12;m++) if(monthRecording(e,m)==="hours") convertMonth(e,m,true);
    });
    delete S.params.divisor; delete S.role;
    render();
  });
})();
