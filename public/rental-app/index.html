<!DOCTYPE html>
<html lang="en"><head>
<base href="/rental-app/">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Rentals</title>
<script src="./vendor/chart.umd.min.js"></script>
<script src="./vendor/xlsx.full.min.js"></script>
<!-- Invoices and statements are saved as real PDF files so they can be
     attached to an email; both libraries are vendored, nothing is fetched. -->
<script src="./vendor/html2canvas.min.js"></script>
<script src="./vendor/jspdf.umd.min.js"></script>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#1e2a78;--brand2:#f04e23;--accent:#10b981;--bad:#ef4444;--warn:#f59e0b;--soft:#eef1fb;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;color:var(--ink);}
header{background:linear-gradient(120deg,#141f66,#28348a);color:#fff;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
header h1{margin:0;font-size:20px;font-weight:700;}
header .sub{opacity:.9;font-size:12px;margin-top:3px;}
header .who{font-size:12px;text-align:right;}
.usermenu-wrap{position:relative;display:inline-block;}
.usermenu-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.usermenu-btn:hover{background:rgba(255,255,255,.2);}
.usermenu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);min-width:190px;z-index:60;overflow:hidden;text-align:left;}
.usermenu button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:10px 14px;font-size:13px;color:#0f172a;cursor:pointer;}
.usermenu button:hover{background:var(--soft);}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 26px;position:sticky;top:0;z-index:20;}
.tab{padding:12px 15px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);}
.wrap{max-width:1500px;margin:0 auto;padding:0 18px 60px;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.toolbar label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;}
select,button,input,.filebtn{font-family:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);padding:7px 10px;background:#fff;}
button,.filebtn{cursor:pointer;} button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600;} button.primary:hover{background:#16205e;}
button.ghost:hover,.filebtn:hover{background:var(--soft);}
.spacer{flex:1;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;}
.card .v{font-size:23px;font-weight:700;margin:5px 0 2px;} .card .d{font-size:12px;color:var(--muted);font-weight:600;}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.panel h3{margin:0 0 4px;font-size:15px;} .panel .hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
/* A name that opens something, without looking like a button in a dense grid */
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;}
.linkish:hover{color:var(--navy1,#1e3179);text-decoration:underline;}
/* Toolbar dropdowns (Invoice ▾ / Reports ▾) */
.menuwrap{position:relative;display:inline-block;}
.menu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.16);min-width:230px;padding:5px;}
.menu.open{display:block;}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink);}
.menu button:hover{background:var(--soft);}
.tblwrap{overflow-x:auto;position:relative;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
thead th{background:var(--soft);color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11px;}
/* Frozen headings. A .tblwrap already scrolls horizontally, which makes it a
   scroll container on BOTH axes — so the table has to scroll inside it for
   sticky to bite (sticking to the page would never fire). .tblwrap.freeze
   gives the grid its own height and pins the heading row, and the first column
   with it, so tenant and month stay readable however far you scroll. */
/* Height is set in JS (fitFreeze) to exactly the space left below the grid:
   the app runs in an iframe whose height the portal decides, so any vh or
   calc() guess leaves the iframe's OWN document scrolling — and then the whole
   table, heading included, slides away no matter how sticky the row is. */
.tblwrap.freeze{overflow:auto;}
/* border-collapse:collapse breaks sticky table headings — the collapsed
   borders belong to the table, not the cells, so the browser will not lift the
   row. The frozen grid therefore uses separate borders and draws its own,
   which looks identical. Percentage height, not calc(100vh - Npx): the app
   runs in an iframe whose height the portal sets, and a fixed subtraction can
   compute to nothing on a short window. */
.tblwrap.freeze table{border-collapse:separate;border-spacing:0;}
.tblwrap.freeze th,.tblwrap.freeze td{border-bottom:1px solid var(--line);}
.tblwrap.freeze thead th{position:sticky;top:0;z-index:6;box-shadow:inset 0 -1px 0 var(--line);}
.tblwrap.freeze tbody td:first-child{position:sticky;left:0;background:#fff;z-index:5;box-shadow:inset -1px 0 0 var(--line);}
.tblwrap.freeze thead th:first-child{position:sticky;left:0;background:var(--soft);z-index:7;box-shadow:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line);}
@media print{ .tblwrap.freeze{max-height:none;overflow:visible;} .tblwrap.freeze thead th,.tblwrap.freeze tbody td:first-child{position:static;} }
tr.total td{border-top:2px solid var(--ink);font-weight:700;background:#eef1fb;}
.num{text-align:right;}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;}
.PAID{background:#dcfce7;color:#166534;} .PARTIAL{background:#fef9c3;color:#854d0e;} .UNPAID{background:#fee2e2;color:#991b1b;} .NA{background:#f1f5f9;color:#94a3b8;} .UPCOMING{background:#eff6ff;color:#3b82f6;}
.actions{position:sticky;right:0;background:#fff;box-shadow:-6px 0 6px -4px rgba(0,0,0,.08);text-align:center;}
thead .actions{background:var(--soft);}
.iconbtn{border:none;background:none;cursor:pointer;font-size:14px;padding:2px 5px;color:var(--muted);} .iconbtn:hover{color:var(--brand);}
.chip{font-size:11px;color:#1e2a78;}
canvas{max-height:300px;} .hidden{display:none;} .warn{color:var(--bad);font-weight:700;}
.flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:.3s;z-index:99;} .flash.show{opacity:1;}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal .box{background:#fff;border-radius:14px;padding:22px;width:min(640px,94vw);max-height:92vh;overflow:auto;}
.modal h3{margin:0 0 14px;}
.frow{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.frow label{flex:1;min-width:120px;font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:4px;}
.frow input,.frow select{width:100%;}
.login{position:fixed;inset:0;background:linear-gradient(120deg,#141f66,#28348a);display:flex;align-items:center;justify-content:center;z-index:100;}
.login .box{background:#fff;border-radius:16px;padding:30px;width:min(380px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);}
.login h2{margin:0 0 4px;font-size:20px;} .login p{margin:0 0 18px;font-size:12px;color:var(--muted);}
.login input{width:100%;margin-bottom:10px;padding:10px;}
.login button{width:100%;padding:11px;} .login .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-bottom:8px;}
@media print{
  @page{ size:A4; margin:16mm; }
  html,body{ background:#fff !important; }
  header,.tabs,.toolbar,.noprint{ display:none !important; }
  .wrap{ max-width:none; padding:0; }
  .panel{ box-shadow:none !important; border:none !important; border-radius:0; padding:0; margin:0 0 10mm; }
  .actions{ position:static; box-shadow:none; }
  .invoice-doc,.stmt-doc{ font-size:12.5px; }
  .tblwrap{ overflow:visible; }
  table{ font-size:12px; } th,td{ padding:6px 8px; }
  tr,td,th,.panel{ break-inside:avoid; }
}
</style></head>
<body>
<div id="loginHost"></div>
<div id="app" class="hidden">
<header>
  <div style="display:flex;align-items:center;gap:14px">
    <img id="hdrLogo" alt="" style="max-height:46px;width:auto;display:none;background:#fff;border-radius:8px;padding:3px">
    <div><h1 id="hdrTitle">Property Rentals</h1>
    <div class="sub">Tenant contracts · deposits · receipts · arrears · statements</div></div>
  </div>
  <div class="who">
    <div class="usermenu-wrap">
      <button id="userMenuBtn" type="button" class="usermenu-btn"><span id="whoami"></span> <span style="opacity:.7">&#9662;</span></button>
      <div id="userMenu" class="usermenu hidden">
        <button type="button" data-h="openSettings()">&#9881; Settings</button>
        <button type="button" id="menuUsers" data-h="openUsers()">&#128101; Users &amp; access</button>
        <button type="button" data-h="openPrivacy()">&#128274; Privacy Policy</button>
        <button type="button" data-h="logout()" style="color:#f04e23">&#9099; Log out</button>
      </div>
    </div>
    <div id="stamps" style="opacity:.85;margin-top:2px;"></div>
    <button id="btnLogout" class="ghost" style="margin-top:6px;color:#f04e23;">Log out</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="toolbar noprint">
    <label>Year</label><select id="selYear"></select>
    <div class="spacer"></div>
    <button id="btnAdd" class="ghost">+ Add tenant</button>
    <button id="btnImport" class="ghost">⭱ Import</button>
    <button id="btnPrint" class="ghost">🖨 Print / PDF</button>
    <button id="btnSave" class="primary">💾 Save</button>
  </div>
  <div id="view"></div>
</div>
</div>
<div class="flash" id="flash"></div>
<div id="modalHost"></div>
<input id="pdfInput" type="file" accept="application/pdf" class="hidden">
<script src="./app.js"></script>
</body></html>
